name: Release

# One tag per package:  v0.2.0 -> mediapane,  mediapane-claude-v0.1.0 -> plugins/mediapane-claude
# Publishing uses PyPI trusted publishing: no API token is stored anywhere. Each package needs a
# trusted publisher on PyPI pointing at this repository, this workflow and the `pypi` environment.

on:
  push:
    tags: ["v*", "mediapane-claude-v*", "mediapane-diff-v*", "mediapane-relay-v*"]
  workflow_dispatch:  # re-release an existing tag (e.g. after fixing the PyPI publisher)
    inputs:
      tag:
        description: "Tag to release, e.g. v0.2.0 or mediapane-claude-v0.1.0"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - name: Package for this tag
        id: pkg
        run: |
          tag="$TAG"
          case "$tag" in
            v*) dir=. version="${tag#v}" ;;
            mediapane-*-v*) dir="plugins/${tag%-v*}" version="${tag##*-v}" ;;
            *) echo "unexpected tag $tag"; exit 1 ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install ffmpeg (video tests)
        # Best effort: the runners' apt mirror is sometimes very slow. Without ffmpeg the
        # video tests skip; other jobs still cover them
        continue-on-error: true
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
      - name: Test
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: uv sync && uv run pytest -q
      - name: Build
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: uv build --out-dir "$GITHUB_WORKSPACE/dist"
      - name: The tag matches the package version
        run: |
          ls dist
          ls dist | grep -q -- "-${{ steps.pkg.outputs.version }}[-.]" \
            || { echo "tag $TAG doesn't match the version in the package"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
