name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg
        # Best effort: the runners' apt mirror is sometimes very slow. Without ffmpeg the
        # video tests skip; other jobs still cover them
        continue-on-error: true
        timeout-minutes: 8
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install ffmpeg; else
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
          fi
      - run: uv sync
      - run: uv run ruff format --check src tests examples
      - run: uv run ruff check src tests examples
      - run: uv run pytest -q

  plugins:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        plugin: [mediapane-claude, mediapane-diff, mediapane-relay]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync  # against the core in this commit (tool.uv.sources: path = "../..")
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q
