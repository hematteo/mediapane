[project]
name = "mediapane-diff"
dynamic = ["version"]
description = "mediapane plugin: compare two images side by side, as a flicker and as a difference heatmap; works as a git difftool."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "hematteo" }]
keywords = ["terminal", "images", "diff", "git", "difftool", "mediapane"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["mediapane>=0.2"]

[project.urls]
Homepage = "https://github.com/hematteo/mediapane"
Issues = "https://github.com/hematteo/mediapane/issues"

[project.entry-points."mediapane.plugins"]
diff = "mediapane_diff"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv.sources]
mediapane = { path = "../..", editable = true }

[tool.hatch.build.targets.sdist]
exclude = ["/uv.lock"]

[tool.hatch.version]
path = "src/mediapane_diff/__init__.py"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
